<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocGuide — Interactive Prototype Walkthrough & Typed Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090e17;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --accent-orange: #ea580c;
      --accent-orange-hover: #c2410c;
      --accent-blue: #2563eb;
      --accent-green: #16a34a;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-dim: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Control Toolbar */
    .demo-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .demo-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .demo-badge {
      background: #1e3a8a;
      color: #93c5fd;
      border: 1px solid #3b82f6;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
    }
    .demo-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-step {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text-sub);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-step:hover, .btn-step.active {
      background: var(--accent-orange);
      color: #fff;
      border-color: var(--accent-orange);
    }
    .btn-action {
      background: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-action:hover { background: #1d4ed8; }

    /* Stage Viewer */
    .walkthrough-stage {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
    }
    .stage-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      min-height: 580px;
    }
    .stage-header {
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stage-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .stage-badge {
      font-size: 12px;
      font-weight: 700;
      background: rgba(234, 88, 12, 0.15);
      color: #fb923c;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(234, 88, 12, 0.4);
    }

    /* Simulation Elements */
    .sim-form-group {
      margin-bottom: 16px;
    }
    .sim-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    .sim-input {
      width: 100%;
      background: #090e17;
      border: 1px solid #334155;
      padding: 10px 14px;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .sim-input.focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    /* Chat Simulation */
    .chat-box {
      background: #090e17;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 20px;
      height: 380px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 16px;
    }
    .msg-bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }
    .msg-user {
      align-self: flex-end;
      background: #1e3a8a;
      color: #eff6ff;
      border-bottom-right-radius: 2px;
    }
    .msg-bot {
      align-self: flex-start;
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      border-bottom-left-radius: 2px;
    }
    .role-header {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sentiment-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      margin-top: 6px;
    }
    .sentiment-positive { background: #14532d; color: #86efac; border: 1px solid #22c55e; }
    
    .cursor-blink {
      display: inline-block;
      width: 2px;
      height: 14px;
      background: #3b82f6;
      animation: blink 0.8s infinite;
      vertical-align: middle;
      margin-left: 2px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Trades Grid Simulation */
    .trades-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .trade-card {
      background: #090e17;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 16px;
      transition: all 0.2s;
    }
    .trade-card.highlight {
      border-color: var(--accent-orange);
      box-shadow: 0 0 15px rgba(234, 88, 12, 0.3);
    }
    .trade-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: #1e293b;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .trade-stat {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #1e293b;
    }

    /* Admin Dashboard Simulation */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat-box {
      background: #090e17;
      border: 1px solid #1e293b;
      padding: 16px;
      border-radius: 8px;
    }
    .stat-val { font-size: 26px; font-weight: 800; color: #fff; margin: 4px 0; }
    .stat-lbl { font-size: 12px; color: var(--text-sub); }

    .narration-box {
      background: #1e293b;
      border-left: 4px solid var(--accent-orange);
      padding: 12px 18px;
      border-radius: 0 8px 8px 0;
      margin-top: 20px;
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Controls -->

    function renderStep(idx) {
      currentStep = idx;
      const step = steps.find(s => s.id === idx);
      if (!step) return;

      document.querySelectorAll(".btn-step").forEach((b, i) => {
        b.classList.toggle("active", i + 1 === idx);
      });

      const container = document.getElementById("stageContent");
      container.innerHTML = step.render();
      step.action();
    }

    function jumpToStep(idx) {
      if (isPlaying) toggleAutoPlay();
      renderStep(idx);
    }

    function simulateTyping(elementId, text, speed, callback) {
      const el = document.getElementById(elementId);
      if (!el) return;
      el.value = "";
      let i = 0;
      const timer = setInterval(() => {
        if (i < text.length) {
          el.value += text.charAt(i);
          i++;
        } else {
          clearInterval(timer);
          if (callback) callback();
        }
      }, speed);
    }

    function toggleAutoPlay() {
      const btn = document.getElementById("playBtn");
      if (isPlaying) {
        clearInterval(autoPlayTimer);
        isPlaying = false;
        btn.innerHTML = "▶ Auto-Play Tour";
        btn.style.background = "#2563eb";
      } else {
        isPlaying = true;
        btn.innerHTML = "⏸ Pause Tour";
        btn.style.background = "#ea580c";
        autoPlayTimer = setInterval(() => {
          let next = currentStep + 1;
          if (next > steps.length) next = 1;
          renderStep(next);
        }, 5500);
      }
    }

    // Initialize first step
    renderStep(1);
